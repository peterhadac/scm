name: Site bug
description: Something on the website is broken or misbehaving (a filter, a link, layout, etc.).
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem — what you did and what went wrong.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page where it happened.
      placeholder: https://peterhadac.github.io/scm/...
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome on Android, Safari on iPhone
    validations:
      required: false
