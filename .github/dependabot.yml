version: 2
updates:
  # Workflow actions — some are SHA-pinned (checkout, setup-node, deploy
  # steps), others float on tags (setup-uv, pnpm/action-setup); Dependabot
  # keeps both current and preserves the pin style it finds.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # Site: astro / starlight / theme (pnpm-lock.yaml at repo root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # js-yaml 5.x drops the default export; Starlight itself is pinned to
      # js-yaml ^4 and default-imports it internally, so a major bump here
      # breaks the build regardless of changes on our side (PR #71).
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]

  # Scraper: crawl4ai / openai / bs4 etc. (uv-managed pyproject + uv.lock —
  # Dependabot's pip ecosystem supports uv lockfiles).
  - package-ecosystem: pip
    directory: /scraper
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-patch:
        update-types: [minor, patch]
