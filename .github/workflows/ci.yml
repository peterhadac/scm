name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: scraper/uv.lock
      # --locked: fail the PR check if scraper/uv.lock has drifted from
      # scraper/pyproject.toml, e.g. a Dependabot pin bump that didn't also
      # update the lockfile (issue #114) — catches it here instead of it
      # silently rewriting uv.lock on the next scheduled scrape run.
      - run: uv sync --directory scraper --locked
      # No crawl4ai-setup here: the pytest suite covers pure parsing/normalization
      # logic and never launches a browser or hits the network.
      - run: uv run --directory scraper pytest test_scrape.py

  site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
