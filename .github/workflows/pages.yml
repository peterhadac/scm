name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # GITHUB_TOKEN-authenticated pushes (like scrape.yml's data commits) don't
  # trigger on:push workflows — this workflow_run trigger closes that gap.
  workflow_run:
    workflows: ["Scrape coffee data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # For the alert-on-failure job below (issue #61) — opens/comments on a
  # "Site deploy failing" issue when build or deploy fails.
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Repository variable (Settings -> Secrets and variables ->
          # Actions -> Variables). Unset = analytics scripts not emitted
          # (issue #56) — the build works fine without it.
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          # giscus comments (issue #86) — public repo/category IDs, set as
          # repository variables once Discussions + the giscus app are
          # enabled. Unset = the comments section isn't emitted; the build
          # works either way.
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment

  # Issue #61: a failed deploy silently leaves the last good build up — the
  # scraper side escalates its failures to issues (issue #28), but nothing
  # watched the site side. Same dedup pattern as scrape.yml's roaster
  # escalation: one stable-titled issue, commented on rather than
  # re-created, so a persistent breakage doesn't spam.
  alert-on-failure:
    needs: [build, deploy]
    if: failure() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Site deploy failing"
          body="Pages build/deploy failed — the published site is now stale (it keeps serving the last successful build). See the failed run: $RUN_URL"
          existing=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
