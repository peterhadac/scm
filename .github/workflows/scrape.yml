name: Scrape coffee data

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: write
  # Needed by the "Escalate roasters non-ok for 3+ consecutive runs" step
  # below (issue #28), which opens/comments on an issue via `gh issue`.
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The 2026-07-10 run took ~46 min wall-clock against the previous cap of
    # 45 (issue #38) — headroom, not a target; the per-roaster durations in
    # the scrape_status stdout summary show where the time actually goes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: scraper/uv.lock
      - run: uv sync --directory scraper
      - run: uv run --directory scraper crawl4ai-setup
      - run: uv run --directory scraper python scrape.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Issue #62: run one known-good fixture page through the real
      # extraction pipeline and ::warning:: on drift — the model fallback
      # (issue #42) catches errors, this catches silently wrong answers.
      # One cheap API call, no crawling; never fails the workflow.
      - name: LLM extraction canary
        run: uv run --directory scraper python scrape.py --canary
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Issue #28, suggested fix 3: data/scrape_status.yaml (just written by
      # the scraper run above) tracks each roaster's consecutive_non_ok
      # streak. A roaster stuck non-ok for 3+ runs in a row is past "one
      # flaky week" and needs a human to look at it — open (or comment on,
      # to avoid duplicate spam) a stable-titled issue per roaster.
      - name: Escalate roasters non-ok for 3+ consecutive runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY' > escalations.tsv
          import yaml
          THRESHOLD = 3
          try:
              data = yaml.safe_load(open("data/scrape_status.yaml")) or {}
          except FileNotFoundError:
              data = {}
          for slug, record in data.items():
              if not isinstance(record, dict):
                  continue
              if record.get("consecutive_non_ok", 0) >= THRESHOLD:
                  name = record.get("name", slug)
                  status = record.get("status", "?")
                  streak = record.get("consecutive_non_ok")
                  print(f"{name}\t{status}\t{streak}")
          PY
          while IFS=$'\t' read -r name status streak; do
            [ -z "$name" ] && continue
            title="Roaster health: $name"
            body="Roaster **$name** has been non-ok for $streak consecutive scrape runs (current status: \`$status\`). Needs attention — check whether it needs \`scraper: playwright\`, has a dead \`scrape_url\`, or should be delisted from \`roasters.yaml\`. See \`data/scrape_status.yaml\` for the full history."
            existing=$(gh issue list --state open --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done < escalations.tsv
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # add BEFORE diffing (staged diff): a plain `git diff --quiet` never
          # sees a brand-new untracked artifact (the first-ever
          # scrape_status.yaml / price_history.csv), so it would skip the
          # commit that should introduce the file.
          git add data/products.yaml data/scrape_status.yaml
          # created on the first run with >=1 ok product; git add errors on
          # a pathspec that matches nothing, hence the existence guard
          [ -f data/price_history.csv ] && git add data/price_history.csv
          if git diff --quiet --staged -- data/products.yaml data/scrape_status.yaml data/price_history.csv; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: $(date -u +%F)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          echo "Failed to push after 3 attempts"
          exit 1
