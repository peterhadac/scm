# Canonical coffee-producing country -> alias list (casings + Slovak/Czech
# spellings) used to translate a stated origin to English and, when origin is
# null, to scan the product name for a country mention. Generic region names
# that don't pin one country (e.g. Yirgacheffe) are deliberately NOT included.
# A region that unambiguously belongs to exactly one country IS listed as an
# alias of that country (e.g. Huila/Tolima -> Colombia, Blue Mountain ->
# Jamaica, Sumatra -> Indonesia), so a page stating only the region still
# resolves to its country instead of falling to null (issue #106).
Ethiopia: [ethiopia, etiópia, etiopia]
Brazil: [brazil, brazília, brazilia, brasil]
Colombia: [colombia, kolumbia, huila, tolima]
Kenya: [kenya, keňa, kena]
Guatemala: [guatemala]
Rwanda: [rwanda]
Burundi: [burundi]
Honduras: [honduras]
Peru: [peru]
Mexico: [mexico, mexiko]
Nicaragua: [nicaragua, nikaragua]
Costa Rica: [costa rica, kostarika, costarica]
Panama: [panama, panamá]
El Salvador: [el salvador, salvador]
Bolivia: [bolivia]
Ecuador: [ecuador, ekvador]
Vietnam: [vietnam]
# NOTE: "bali" is deliberately NOT an Indonesia alias — matching is
# substring-based and "bali" sits inside diacritic-stripped "balíček"
# (bundle), which would misclassify every coffee-bundle product.
Indonesia: [indonesia, indonézia, indonezia, indonézie, indonezie, sumatra]
India: [india]
Yemen: [yemen, jemen]
China: [china, čína, cina]
Tanzania: [tanzania, tanzánia]
Uganda: [uganda]
Malawi: [malawi]
Zambia: [zambia]
Papua New Guinea: [papua new guinea, papua nova guinea, papua-nová guinea]
South Africa: [south africa, južná afrika, juhoafrická republika]
Democratic Republic of the Congo: [congo, kongo]
Ivory Coast: [ivory coast, pobrežie slonoviny]
Dominican Republic: [dominican republic, dominikánska republika]
Jamaica: [jamaica, jamajka, blue mountain]
Cuba: [cuba, kuba]
Haiti: [haiti]
Philippines: [philippines, filipíny, filipiny]
Thailand: [thailand, thajsko]
Myanmar: [myanmar, mjanmarsko]
Laos: [laos]
Timor-Leste: [timor-leste, "east timor"]
