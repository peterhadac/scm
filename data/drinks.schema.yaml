$schema: "http://json-schema.org/draft-07/schema#"
title: drinks.yaml entry
type: object
required: [title, description, ingredients, method, temperature, milk_content, origin_country, family, status, last_seen, schema_version]
properties:
  status: {const: ok}
  title: {type: string, minLength: 1}
  description: {type: string, minLength: 1}
  ingredients:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  method:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  temperature: {enum: [hot, cold]}
  milk_content: {enum: [milk, no milk]}
  origin_country: {type: string, minLength: 1}
  family: {enum: [espresso, milk-based, brewed, iced, regional, dessert, spirited]}
  last_seen: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
  schema_version: {type: integer}
