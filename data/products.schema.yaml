$schema: "http://json-schema.org/draft-07/schema#"
title: products.yaml entry
oneOf:
  - $ref: "#/definitions/ok_product"
  - $ref: "#/definitions/incomplete_product"
  - $ref: "#/definitions/not_a_product"

definitions:
  ok_packaging_tier:
    type: object
    required: [weight_g, price]
    properties:
      weight_g: {type: integer, exclusiveMinimum: 0}
      price: {type: number, exclusiveMinimum: 0}
      # Present only when a product sells this same weight in more than one
      # form (e.g. whole bean vs ground) — distinguishes such tiers from one
      # another. Absent, never null, on every other tier.
      variant: {type: string, minLength: 1}

  incomplete_packaging_tier:
    type: object
    required: [weight_g, price]
    properties:
      weight_g: {type: [integer, "null"], exclusiveMinimum: 0}
      price: {type: [number, "null"], exclusiveMinimum: 0}
      variant: {type: string, minLength: 1}

  ok_product:
    type: object
    required: [name, url, origin, process, roast_type, status, last_seen, page_hash, packaging, schema_version]
    properties:
      status: {const: ok}
      name: {type: string, minLength: 1}
      url: {type: string}
      origin: {type: string, minLength: 1}
      # Blend metadata (issue #91): present only on multi-origin blends, whose
      # `origin` stays the canonical "Blend" sentinel. blend_origins is the
      # display-only composition, each entry a canonical country name.
      blend: {const: true}
      blend_origins:
        type: array
        items: {type: string, minLength: 1}
      process: {enum: [washed, natural, honey, wet-hulled, anaerobic, carbonic-maceration, other, null]}
      roast_type: {enum: [filter, espresso, nespresso, drip-bag, decaf]}
      # Decaffeinated flag (issue #139)
      is_decaffeinated:
        type: [boolean, "null"]
      # Price range (issue #89)
      price_from:
        type: [number, "null"]
        exclusiveMinimum: 0
      price_to:
        type: [number, "null"]
        exclusiveMinimum: 0
      quantity:
        type: [integer, "null"]
        minimum: 0
      # Sensory ratings (issue #141)
      sweetness:
        type: [integer, "null"]
        minimum: 0
        maximum: 10
      acidity:
        type: [integer, "null"]
        minimum: 0
        maximum: 10
      body:
        type: [integer, "null"]
        minimum: 0
        maximum: 10
      bitterness:
        type: [integer, "null"]
        minimum: 0
        maximum: 10
      # Tasting notes (issue #138)
      tasting_notes:
        type: [string, "null"]
      # Brewing recommendations (issue #140)
      brewing_recommendations:
        type: [string, "null"]
      # Stock status (issue #142)
      stock_status:
        type: [string, "null"]
        enum: [in-stock, out-of-stock, pre-order, null]
      packaging:
        type: array
        minItems: 1
        items: {$ref: "#/definitions/ok_packaging_tier"}
      last_seen: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
      page_hash: {type: string}
      schema_version: {type: integer}
      # Multi-origin blend marker (issue #91): stamped (true) only on
      # entries whose origin is the "Blend" sentinel — absent on
      # single-origin coffees. blend_origins is the blend's component
      # countries (canonical English names) when the page lists them.
      blend: {const: true}
      blend_origins:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}

  incomplete_product:
    type: object
    required: [name, url, status, last_seen, page_hash, missing_fields, schema_version]
    properties:
      status: {const: incomplete}
      missing_fields:
        type: array
        minItems: 1
        items: {enum: [origin, roast_type, weight_g, price]}
      name: {type: string}
      url: {type: string}
      origin: {type: [string, "null"]}
      blend: {const: true}
      blend_origins:
        type: array
        items: {type: string, minLength: 1}
      process: {enum: [washed, natural, honey, wet-hulled, anaerobic, carbonic-maceration, other, null]}
      roast_type: {type: [string, "null"]}
      is_decaffeinated:
        type: [boolean, "null"]
      price_from:
        type: [number, "null"]
      price_to:
        type: [number, "null"]
      quantity:
        type: [integer, "null"]
      sweetness:
        type: [integer, "null"]
        minimum: 0
        maximum: 10
      acidity:
        type: [integer, "null"]
        minimum: 0
        maximum: 10
      body:
        type: [integer, "null"]
        minimum: 0
        maximum: 10
      bitterness:
        type: [integer, "null"]
        minimum: 0
        maximum: 10
      tasting_notes:
        type: [string, "null"]
      brewing_recommendations:
        type: [string, "null"]
      stock_status:
        type: [string, "null"]
        enum: [in-stock, out-of-stock, pre-order, null]
      packaging:
        type: array
        items: {$ref: "#/definitions/incomplete_packaging_tier"}
      last_seen: {type: string}
      page_hash: {type: string}
      schema_version: {type: integer}
      # How many times an unchanged page has been re-extracted and still come
      # out incomplete (issue #36) — absent means 0; the hash gate holds once
      # it reaches MAX_INCOMPLETE_REEXTRACTIONS in scraper/scrape.py.
      reextract_attempts: {type: integer, minimum: 1}
      # Same blend marker as ok_product (issue #91) — an incomplete blend
      # (e.g. missing roast_type) still carries it.
      blend: {const: true}
      blend_origins:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}

  not_a_product:
    type: object
    required: [url, status, last_seen, page_hash]
    properties:
      status: {const: not_a_product}
      url: {type: string}
      last_seen: {type: string}
      page_hash: {type: string}
