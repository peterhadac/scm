  tasting_notes: Spoznajte rozmanitosť chutí, ktoré ponúka slnečná Brazília. Tento
    výhodný set spája tri chuťovo odlišné kávy spracované tradičnou suchou metódou
    (natural), ktoré vám predstavia túto kávovú veľmoc v celej jej kráse. Od sladkej
    klasiky až po moderné, ovocnejšie tóny. Vychutnajte si tri jedinečné chuťové profily
    s príjemnou zvýhodnenou cenou. Čo všetko v balíku nájdete? Brazil Caramelo Natural
    (espresso) Naša najpopulárnejšia stálica z farmy San Rafael. Vyznačuje sa plným
    krémovým telom, nulovou aciditou a vysokou sladkosťou s tónmi karamelu, čokolády
    a orechov. Káva, ktorú si zamiluje doslova každý. Brazil Morada da Prata Natural
    (espresso) Brazília, no tentokrát trochu inak. Káva z rodinnej farmy s históriou
    od roku 1936 vystupuje z radu svojím sviežim, jemne ovocným profilom. Sprevádza
    ju príjemný „funky“ charakter, v ktorom dominuje slivka, karamel a hĺbka para
    orechov. Brazil Rodomunho Natural (filter) Svetlejšie pražený klenot z rodinnej
    farmy Fazenda Rodomunho, ideálny na filter. Ponúka zamatovo sladké a šťavnaté
    telo s tónmi zrelého hrozna, medu a čerstvých jahôd.
