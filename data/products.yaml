  tasting_notes: SUŠENÉ OVOCIE – ČOKOLÁDA – RUM Mandala Blend je nami vytvorená zmes
    káv vyváženej chuti s tónmi orieškov v sladkej mliečnej čokoláde s náznakom ovocných
    tónov lesného ovocia. Zloženie je obmieňané počas roka za účelom využitia maximálne
    čerstvých zberov pri zachovaní identického chuťového profilu. Mandala Blend je
    vhodná ako moderné espresso, či vynikajúci základ pre mliečne kávové nápoje. Aktuálne
    sme Mandala blend namiešali z dvoch vynikajúcich naturálok z Kolumbie z farmy
    La Claudina a Brazílie Monte Alto. Rumovo čokoládová Monte Alto tvorí základ blendu,
    ktorú dopĺňa ovocná a šťavnatá La Claudina z regiónu Antioquia, Kolumbia V chuti
    očakávajte mix ovocia, čokolády a sladkej rumovej dochuti. Pre maximálny pôžitok
    spotrebujte kávu do 6 mesiacov od dátumu praženia vyznačeného na obale. Skladujte
    v suchu a pri izbovej teplote.
