  brewing_recommendations: 'Pákový kávovar: Dávka: 18 g, Výťažok: 38 – 42 g espressa,
    Čas extrakcie: 26 – 30 sekúnd, Teplota: 92 – 94 °C, Pomer: približne 1 : 2 až
    1 : 2,3. Ak chcete sladšie a hutnejšie espresso, držte sa výťažku okolo 36 – 38
    g. No ak chcete viac sviežosti a čistejší prejav, skúste výťažok 40 – 42 g. Ak
    je espresso príliš kyslé, skúste jemnejšie mletie alebo mierne vyššiu teplotu.
    V prípade, že je horké a suché, skúste hrubšie mletie alebo kratší výťažok. Automatický
    kávovar: Mletie: stredne jemné, Intenzita: stredná až vyššia, Objem espressa:
    35 – 45 ml, Objem lunga: 70 – 90 ml. Pri tejto káve neodporúčame robiť veľký hrnček
    z jednej dávky. Ak chcete väčší nápoj, pripravte radšej dve kratšie kávy než jednu
    príliš dlhú extrakciu. Ak je káva slabá, nastavte jemnejšie mletie alebo znížte
    objem vody. V prípade, že je príliš horká, nastavte mletie o jeden stupeň hrubšie.
    Filter / V60: Dávka: 18 g kávy, Voda: 280 – 300 ml, Teplota vody: 92 – 94 °C,
    Mletie: stredné, Čas prípravy: 2:45 – 3:15. Začnite preliatím 40 – 50 ml vody
    a nechajte kávu približne 30 sekúnd rozkvitnúť. Potom dolievajte postupne do výsledného
    objemu. Na V60 očakávajte sladší a čistejší profil: karamel, jemné orechy, miernu
    aciditu a hladkú dochuť. French press: Dávka: 60 g kávy na 1 liter vody, Mletie:
    hrubé, Teplota vody: 92 – 94 °C, Čas lúhovania: 4 minúty. Vo French presse bude
    káva plnšia, mäkšia a viac karamelovo-orechová. Je to dobrá príprava pre ľudí,
    ktorí chcú menej ostrosti a viac tela. Moka kanvička: Mletie: stredne jemné, Voda:
    po ventil, Káva: zarovno, bez utláčania, Plameň: stredný až nižší, Odstavenie:
    hneď, keď začne káva výrazne prebublávať. V moka kanvičke bude Dominikánska republika
    hutnejšia a zemitšia. Dôležité je kávu neprepáliť. Ak ju necháte na plameni príliš
    dlho, stratí sladkosť a vystúpi horkosť.'
