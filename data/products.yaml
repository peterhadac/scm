  brewing_recommendations: "Pákový espresso kávovar\n_Brew ratio (vstupná gramáž,\
    \ výstupná gramáž, čas): Najčastejšie používaný pomer pre espresso je 1:2 až 1:2,5\
    \ (káva:voda), a čas približne 20-25s_\n  * 1.krok: Odvážime si čerstvo namletú\
    \ kávu (príklad 14g)\n  * 2.krok: Nasypeme kávu do suchého a čistého portafiltra,\
    \ rovnomerne rozložíme a utampujeme\n  * 3.krok: Vždy pred a po extrakcii odpustíme\
    \ horúcu vodu z hlavy, nasadíme páku a spúšťame extrakciu\n  * 3.krok: Výslednú\
    \ extrakciu v šálke “púšťame” na váhu, v prípade že používame 14g kávy a brewratio\
    \ 1:2,5, výsledný objem by mal byť 35g pri čase 20-25 sekúnd.\n\n\nMalý tip na\
    \ záver: Ak sa espresso extrahuje prirýchlo, treba zvoliť jemnejšie mletie. Ak\
    \ sa espresso extrahuje príliš pomaly, treba naopak zvoliť hrubšie mletie. Neexistuje\
    \ univerzálny recept pre espresso, každá káva si vyžaduje iný prístup. Ak budete\
    \ hľadať ten správny recept pre tú vašu kávu, nemeňte vždy naraz všetky hodnoty\
    \ (čas, vstupná gramáž, výstupná gramáž). Pracujte vždy iba s jednou premenou\
    \ a pozorujte zmeny v chutí.\nAutomatický kávovar\nKaždý automatický kávovar má\
    \ svoje nastavenia, o ktoré sa nemusíte starať. Väčšinou stačí stlačiť gombík.\n\
    Odporúčame používať prefiltrovanú vodu, ktorou zlepšíte chuť kávy o 100%\nMoka\
    \ kávovar / Koťogo\n_Vodu ktorú budeme používať si dopredu zohrejeme v konvici,\
    \ aby sme sa vyhli zbytočne dlhému vriacemu procesu pri prírpave kávy_\n_Používame\
    \ o trochu hrubšie mletie ako na espresso_\n  * **1.krok** : Zohriatu vodu nalejeme\
    \ do spodnej časti mokky tesne pod ventil\n  * **2.krok** : Do sitka nasypeme\
    \ do plna čerstvo namletú kávu, neutláčame\n  * **3.krok** : Poskladáme všetky\
    \ časti mokky a dáme zohrievať\n  * **4.krok** : Keď budeme počuť jemné “chrchlanie”\
    \ káva je hotová.\n  * **5.krok** : Ochladíme spodnú časť mokky aby sme zastavili\
    \ proces extrakcie\n\n\n**Malý tip na záver** : Udržiavať čistotu moka expressu\
    \ je veľmi dôležité, je potrebné ho dôkladne prepláchnuť po každej príprave kávy.\
    \ Pokiaľ bude mokka express zanesený od nečistôt, môže spôsobovať nežiadúcu horkú\
    \ chuť kávy. Ak vám káva z mokky “vyprskla” príliž rýchlo, pravdepodobne ste ju\
    \ varili na silnom ohni. Spomalte teplotu a extrakcia bude plynulá a chuť komplexná.\
    \ Nazdravie:)"
