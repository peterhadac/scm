    process has opened the pores of the coffee, allowing for caffeine extraction.
    Then, the coffee is placed in a solution of water and Ethyl Acetate, which is
    a naturally occurring compound and solvent derived through the fermentation of
    sugar cane. During this process, the solvent naturally bonds to the salts of chlorogenic
    acids within the coffee, allowing for the extraction of caffeine – this continues
    for about eight hours.

    After the last of the caffeine has been extracted, the coffee is removed from
    the solution and prepared for another steaming. The final low-pressure steaming
    removes the remaining traces of Ethyl Acetate. Decaffeinated coffee is then dried,
    physically polished to ensure cleanliness, and packaged to export.'
