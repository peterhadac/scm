[project]
name = "scm-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "crawl4ai==0.9.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "openai==2.53.0",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
